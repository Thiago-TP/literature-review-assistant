# Ruff configuration for the Python outside backend/: the launcher (main.py)
# and the utility scripts in scripts/. The rules themselves live in
# backend/ruff.toml and are inherited unchanged, so there is one set of rules
# for the whole repository.
#
# Ruff uses the closest config above each file, so files in backend/ keep
# using backend/ruff.toml directly and everything else lands here. Without this
# file, running Ruff from the repository root (as an editor integration does)
# fell back to Ruff's defaults for these files and disagreed with CI.
#
# From the repository root:
#   backend/.venv/bin/ruff check .
#   backend/.venv/bin/ruff format .
extend = "backend/ruff.toml"

# The scripts import each other and the launcher as top-level modules (a
# script's own directory is on sys.path when it runs), so both places count as
# this repository's code when sorting imports. Left to guess, Ruff would sort
# `main` and `screenshot_data` into different groups.
src = [".", "scripts"]
