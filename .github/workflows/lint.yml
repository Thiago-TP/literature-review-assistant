name: Lint

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run on that branch pointless.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Pinned rather than read from .python-version, which is gitignored.
          python-version: "3.13"

      # --locked fails rather than silently resolving something new, so a
      # pyproject change that was not locked is caught here.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      # The repository's utility scripts are held to the backend's rules. Ruff
      # only finds a config in a file's own ancestors, and scripts/ has none,
      # so without --config they would quietly get Ruff's defaults instead.
      - name: Ruff (scripts, lint)
        run: uv run ruff check --config ruff.toml --output-format=github ../scripts

      - name: Ruff (scripts, format)
        run: uv run ruff format --config ruff.toml --check ../scripts
